name: Daily free evidence check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # 18:00 Asia/Seoul; actual Actions dispatch may be delayed.

permissions:
  contents: read
  actions: read

concurrency:
  group: expert-gemini-project-quota
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'kco994553-star/lol-coach' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
      GEMINI_DOCUMENTED_FREE_ENTITLEMENT_CONFIRMED: ${{ vars.GEMINI_DOCUMENTED_FREE_ENTITLEMENT_CONFIRMED }}
      GEMINI_QUOTA_EXCLUSIVE_CONFIRMED: ${{ vars.GEMINI_QUOTA_EXCLUSIVE_CONFIRMED }}
      INITIAL_ZERO_USAGE_CONFIRMED: ${{ vars.INITIAL_ZERO_USAGE_CONFIRMED }}
      INITIAL_ZERO_USAGE_CONFIRMED_AT: ${{ vars.INITIAL_ZERO_USAGE_CONFIRMED_AT }}
      GEMINI_PROJECT_BILLING_TIER: ${{ vars.GEMINI_PROJECT_BILLING_TIER }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Recover both durable ledgers including failed and cancelled runs
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_gemini_daily.py --phase recover --config config/evidence_intake.json --runtime-config config/expert_runtime.json --output-dir "$RUNNER_TEMP/daily/recovery"
      - name: Check free gates and reserve one Seoul-date TEXT slot
        id: pretext
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/run_gemini_daily.py --phase pretext --config config/evidence_intake.json --runtime-config config/expert_runtime.json --state "$RUNNER_TEMP/daily/recovery/daily-state.json" --ledger "$RUNNER_TEMP/daily/recovery/quota-ledger.json" --recovery-receipt "$RUNNER_TEMP/daily/recovery/recovery.json" --output-dir "$RUNNER_TEMP/daily/pretext"
      - name: Persist daily TEXT reservation
        id: text-reservation
        if: steps.pretext.outputs.text_reserved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-daily-state-${{ github.run_id }}-TEXT
          path: |
            ${{ runner.temp }}/daily/pretext/daily-state.json
            ${{ runner.temp }}/daily/pretext/quota-ledger.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch one short TEXT without retry or fallback
        id: text
        if: steps.text-reservation.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ACK: ${{ steps.text-reservation.outputs.artifact-id }}
        run: python scripts/run_gemini_daily.py --phase text --config config/evidence_intake.json --runtime-config config/expert_runtime.json --state "$RUNNER_TEMP/daily/pretext/daily-state.json" --ledger "$RUNNER_TEMP/daily/pretext/quota-ledger.json" --reservation-artifact-id "$ACK" --output-dir "$RUNNER_TEMP/daily/text"
      - name: Persist daily TEXT result
        id: text-result
        if: always() && steps.text-reservation.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-daily-state-${{ github.run_id }}-TEXT_RESULT
          path: |
            ${{ runner.temp }}/daily/text/daily-state.json
            ${{ runner.temp }}/daily/text/quota-ledger.json
          if-no-files-found: error
          retention-days: 90
      - name: Select source interval and reserve full original VIDEO charge
        id: preparevideo
        if: steps.text.outputs.text_success == 'true' && steps.text-result.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ACK: ${{ steps.text-result.outputs.artifact-id }}
        run: python scripts/run_gemini_daily.py --phase preparevideo --config config/evidence_intake.json --runtime-config config/expert_runtime.json --state "$RUNNER_TEMP/daily/text/daily-state.json" --ledger "$RUNNER_TEMP/daily/text/quota-ledger.json" --text-result-artifact-id "$ACK" --output-dir "$RUNNER_TEMP/daily/preparevideo"
      - name: Persist daily VIDEO reservation
        id: video-reservation
        if: steps.preparevideo.outputs.video_reserved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-daily-state-${{ github.run_id }}-VIDEO
          path: |
            ${{ runner.temp }}/daily/preparevideo/daily-state.json
            ${{ runner.temp }}/daily/preparevideo/quota-ledger.json
          if-no-files-found: error
          retention-days: 90
      - name: Separate provider requests by a conservative minute
        if: steps.video-reservation.outcome == 'success'
        run: |
          # Project-specific RPM is not exposed here; do not claim a verified quota.
          python -c 'import time; print("Conservative TEXT-to-VIDEO separation: 60s", flush=True); time.sleep(60)'
      - name: Dispatch one bounded VIDEO without retry or alternate model
        id: video
        if: steps.video-reservation.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ACK: ${{ steps.video-reservation.outputs.artifact-id }}
        run: python scripts/run_gemini_daily.py --phase video --config config/evidence_intake.json --runtime-config config/expert_runtime.json --state "$RUNNER_TEMP/daily/preparevideo/daily-state.json" --ledger "$RUNNER_TEMP/daily/preparevideo/quota-ledger.json" --reservation-artifact-id "$ACK" --output-dir "$RUNNER_TEMP/daily/video"
      - name: Prepare newest FINAL state without refunds
        id: final
        if: always()
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'daily';selected=None
          for name in ('pretext','text','preparevideo','video'):
              p=root/name
              if (p/'daily-state.json').is_file() and (p/'quota-ledger.json').is_file():selected=p
          if selected is not None:
              subprocess.run(['python','scripts/run_gemini_daily.py','--phase','final','--config','config/evidence_intake.json','--runtime-config','config/expert_runtime.json','--state',str(selected/'daily-state.json'),'--ledger',str(selected/'quota-ledger.json'),'--output-dir',str(root/'final')],check=True)
          PY
      - name: Persist daily FINAL state
        if: always() && steps.final.outputs.has_state == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gemini-daily-state-${{ github.run_id }}-FINAL
          path: |
            ${{ runner.temp }}/daily/final/daily-state.json
            ${{ runner.temp }}/daily/final/quota-ledger.json
          if-no-files-found: error
          retention-days: 90
      - name: Bind public execution sources
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'daily';out.mkdir(exist_ok=True)
          files=['coach_v1/gemini_daily.py','coach_v1/gemini_response_diagnostics.py','contracts/gemini-response-diagnostic-v3.md','scripts/run_gemini_daily.py','config/evidence_intake.json','config/expert_runtime.json','config/expert_channels.json','config/pov_channels.json','.github/workflows/expert-video-collection.yml','contracts/actual-evidence-v1.md']
          b=dict(schema_version='evidence-daily.source-binding.v1',actual_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),source_sha256={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),coaching_accuracy=None)
          (out/'source-binding.json').write_text(json.dumps(b,indent=2)+'\n')
          PY
      - name: Upload safe phase receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-daily-public-safe
          path: |
            ${{ runner.temp }}/daily/source-binding.json
            ${{ runner.temp }}/daily/*/receipt.json
            ${{ runner.temp }}/daily/*/entitlement.json
            ${{ runner.temp }}/daily/*/source-plan.json
            ${{ runner.temp }}/daily/*/extraction.json
          if-no-files-found: warn
          retention-days: 90
