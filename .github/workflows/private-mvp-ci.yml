name: MVP regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-r3.txt
      - name: Verify synthetic and local MVP scope
        run: python scripts/verify_mvp.py
      - name: Print scope and private-data availability
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          runs = []
          for path in Path('evidence/mvp').glob('*/verification.json'):
              report = json.loads(path.read_text())
              context = report.get('github_actions_context', {})
              if context.get('run_id') == os.environ['GITHUB_RUN_ID'] and context.get('run_attempt') == os.environ['GITHUB_RUN_ATTEMPT']:
                  runs.append(path)
          runs.sort()
          if not runs:
              print('MVP verifier did not produce a report for this workflow attempt.')
          else:
              report = json.loads(runs[-1].read_text())
              print(json.dumps({
                  'scoped_mvp_status': report['status'],
                  'pinned_postgame': report['checks'].get('postgame', {}).get('pinned_source_integration'),
                  'real_match_coaching_validation_passed': False,
                  'browser_e2e_executed': False,
              }, indent=2))
          PY
  browser-regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MVP_BROWSER_SUMMARY_FILE: ${{ runner.temp }}/mvp-browser-summary.json
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-r3.txt
      - name: Install pinned browser automation library
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/mvp-playwright" --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Run actual browser against isolated synthetic server
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/mvp-playwright/node_modules"
          CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          export CHROMIUM_EXECUTABLE
          python scripts/browser_mvp.py | tee "$MVP_BROWSER_SUMMARY_FILE"
      - name: Print fresh browser receipts and source binding
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {'commit_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'scope': 'Actual browser against an isolated synthetic backend; no real game data',
                     'workflow_conclusion': 'Not established by this receipt-printing step'}
          summary = Path(os.environ['MVP_BROWSER_SUMMARY_FILE'])
          try:
              launch = json.loads(summary.read_text())
              directory = Path(launch['evidence_directory'])
              payload['launcher_receipt'] = json.loads((directory / 'runner.json').read_text())
              child = directory / 'receipt.json'
              payload['browser_receipt'] = json.loads(child.read_text()) if child.is_file() else None
          except (OSError, ValueError, KeyError) as error:
              payload['fresh_browser_receipt_status'] = 'NOT_PRODUCED'
              payload['receipt_read_error'] = type(error).__name__ + ': ' + str(error)
          rendered = json.dumps(payload, ensure_ascii=False, indent=2)
          print(rendered)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write('## Synthetic MVP browser receipts\n\n```json\n' + rendered + '\n```\n')
          PY
