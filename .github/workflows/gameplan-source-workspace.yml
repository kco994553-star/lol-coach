name: Gameplan verified backend integration

on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/gameplan-source-workspace.yml']

permissions:
  contents: write

concurrency:
  group: gameplan-baseline-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/gameplan-champion-baseline-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-r3.txt -r requirements-private-cache.txt
      - name: Integrate only the previously tested exact source delta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'web_r4/loading-champion-baseline.js':'da6a7fdeedd8cd72e02dc1406a838a2eae5f2a35dc5fc5e5f830e6aee2007746',
            'tests_pregame/test_champion_baseline.py':'3d9a4c465b66828b5e951af96b58387de3546ed04802e3d88802f885ae805539',
            'docs/gameplan-content/champion-baseline-backend-v1.md':'2fafd0961558ce9a0785e1e7262f2fb87513a38ee6fb96f9cbcd35f574e9dcbd',
            'docs/superpowers/plans/2026-10-25-champion-baseline-backend.md':'5f464ed618d6c05379f40329ffbe60f1ecc7e0aeaee5aab2b96837484a04db46'}
          for path,sha in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,path
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          line="            '/loading-direction-profiles.js':('loading-direction-profiles.js','text/javascript; charset=utf-8'),"
          replace('coach_v1/pregame_server.py',line,line+"\n            '/loading-champion-baseline.js':('loading-champion-baseline.js','text/javascript; charset=utf-8'),")
          line="    'loading-direction-profiles.js':'loading-direction-profiles.js',"
          replace('scripts/build_directions_web.py',line,line+"\n    'loading-champion-baseline.js':'loading-champion-baseline.js',")
          replace('scripts/verify_actual_evidence.py','CURRENT=MODIFIED|{','CURRENT=MODIFIED|{'+"\n    'web_r4/loading-champion-baseline.js',\n    'tests_pregame/test_champion_baseline.py',\n    'docs/gameplan-content/champion-baseline-backend-v1.md',\n    'docs/superpowers/plans/2026-10-25-champion-baseline-backend.md',")
          replace('scripts/verify_actual_evidence.py',"TESTS=['tests_pregame.test_pc_coach'","TESTS=['tests_pregame.test_champion_baseline', 'tests_pregame.test_pc_coach'")
          replace('scripts/verify_actual_evidence.py','    groups={\n',"    groups={\n        'tests_pregame.test_champion_baseline':{'web_r4/loading-champion-baseline.js','web_r4/loading-direction-profiles.js','web_r4/loading-data.json','coach_v1/pregame_server.py','scripts/build_directions_web.py'},\n")
          PY
          git rm .github/workflows/gameplan-source-workspace.yml
          python scripts/verify_actual_evidence.py --prepare
          echo '42d78fd16495625ebf0ddab09a066ca5e6dae2b664bd9403c945f1d80cd57266  contracts/amendments/2026-10-16-actual-evidence.json' | sha256sum -c -
          python scripts/verify_actual_evidence.py
          python -m unittest -v tests_pregame.test_champion_baseline tests_pregame.test_gameplan_backend tests_pregame.test_gameplan_direction tests_pregame.test_gameplan_coaching_content tests_pregame.test_loading_strategy tests_pregame.test_loading_http tests_pregame.test_gameplan_input tests_pregame.test_riot_game_info tests_pregame.test_actual_evidence_binding tests_pregame.test_directions_http
          git diff --check
          # A connector removes this temporary workflow after the code push. The
          # Actions token changes no workflows, main, security policy or secrets.
          git restore --staged --worktree .github/workflows/gameplan-source-workspace.yml
          git add coach_v1/pregame_server.py scripts/build_directions_web.py scripts/verify_actual_evidence.py contracts/amendments/2026-10-16-actual-evidence.json
          git -c user.name='LoL Coach development' -c user.email='noreply@users.noreply.github.com' commit -m 'feat(gameplan): integrate verified champion lookup and exact source bindings'
      - name: Fast-forward the isolated implementation branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/work/gameplan-champion-baseline-20261025
          git rev-parse HEAD
