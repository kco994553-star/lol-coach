<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/pregame-icon.svg"><title>LoL Coach · 표본·티어 비교</title><link rel="stylesheet" href="/pregame.css"><script src="/pregame_power.js" defer></script><script src="/statistics.js" defer></script></head><body><header><a href="/" class="brand">LoL Coach</a><a href="/pregame">경기 전</a><a href="/review-queue">지식 검토</a><a href="/postgame">복기</a></header><main class="stats-page"><section class="panel"><h1>표본 수집·티어 비교</h1><p>같은 패치의 현재 리그 티어로 선별한 표본을 비교합니다. 경기 당시 참가자 전원의 티어는 미확인입니다. 목표 표본은 운영 신뢰구간 기준이며 코칭 정확도가 아닙니다.</p><form id="stats-login"><label>접속키<input id="stats-token" type="password" autocomplete="off" required></label><button>연결</button></form><p id="stats-notice" role="status" aria-live="polite"></p><div id="stats-body" hidden><div class="grid"><label>패치<select id="stats-patch"></select></label><label>포지션<select id="stats-role"><option value="TOP">탑</option><option value="JUNGLE">정글</option><option value="MID">미드</option><option value="BOTTOM">원딜</option><option value="SUPPORT">서포터</option></select></label><label>챔피언<select id="stats-champion"></select></label><label>상위 티어<select id="stats-high"></select></label><label>내 티어대<select id="stats-own"></select></label></div><p id="stats-limitations"></p><div class="grid"><section><h2>상위 티어</h2><div id="stats-high-progress"></div><div id="stats-high-graph"></div></section><section><h2>내 티어대</h2><div id="stats-own-progress"></div><div id="stats-own-graph"></div></section></div><button id="stats-logout" class="secondary">연결 해제</button></div></section></main></body></html>
