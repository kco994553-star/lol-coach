<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoL Coach · 게임플랜 시안</title>
<style>
:root{color-scheme:dark;--bg:#0b101a;--panel:#141c2a;--line:#2b3546;--muted:#a6b2c5;--gold:#e7c17b;--blue:#8cc6ff;--red:#f2a8ac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#20304755,transparent 55%),var(--bg);color:#eef2f9;font:16px/1.75 system-ui,-apple-system,'Noto Sans KR',sans-serif}button,a,summary{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}main{max-width:1180px;padding:32px 28px 64px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:26px;border-bottom:1px solid var(--line)}.logo{font:700 25px Georgia,serif;color:var(--gold)}.small,.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}.eyebrow{color:var(--gold);font-weight:700}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:9px;padding:9px 15px;background:#161f2e;color:var(--muted)}button[aria-pressed=true]{background:#e7c17b;color:#171a20;border-color:var(--gold);font-weight:700}h1{font-size:clamp(25px,3vw,36px);line-height:1.5;letter-spacing:-.04em;margin:10px 0 14px;max-width:1000px}h2{font-size:22px;line-height:1.6;margin:0 0 16px}h3{font-size:16px;margin:0 0 6px}p{margin:0 0 14px}.intro{padding:28px 0 18px}.muted{color:var(--muted)}.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.roster{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.roster-title{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:12px}.enemy .roster-title{color:var(--red)}.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pick{text-align:center;font-size:12px;color:var(--muted)}.portrait{display:block;width:48px;height:48px;border-radius:50%;margin:0 auto 6px;box-shadow:0 0 0 2px #39465b}.pick.self{color:var(--gold);font-weight:bold}.pick.self .portrait{box-shadow:0 0 0 2px var(--gold)}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:24px;margin:20px 0}.plans{display:grid;grid-template-columns:1fr 1fr;gap:26px}.plans article+article{border-left:1px solid var(--line);padding-left:26px}.ours h3{color:var(--blue)}.theirs h3{color:var(--red)}.plans p{margin:8px 0 0}.role{padding:14px 18px;background:#e7c17b0b;border-left:3px solid var(--gold);margin:20px 0 0}summary{cursor:pointer;color:var(--muted);padding:10px 0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.tabnav{padding:8px 0;gap:10px}.tabnav button{flex:1}.content{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}.content .panel{margin:12px 0}.actions{padding:0;list-style:none;counter-reset:action}.actions li{counter-increment:action;display:grid;grid-template-columns:32px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.actions li:last-child{border:0;padding-bottom:0}.actions li:before{content:counter(action,decimal-leading-zero);color:var(--gold);font-size:14px;padding-top:2px}.actions p{margin:0;color:#d1d9e6;font-size:15px}.actions strong{display:block;font-size:13px;color:var(--gold);margin-bottom:4px}.reason p{font-size:15px;color:#c6d0e0}.condition{padding:16px 0;border-top:1px solid var(--line)}.condition h3{color:var(--blue);font-size:14px}.condition p{font-size:14px;margin:5px 0}.stop{color:var(--muted)}.remember{display:flex;gap:16px}.remember p{flex:1;font-size:14px;margin:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:28px}footer{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:240px;overflow:auto}a{color:var(--blue)}@media(max-width:740px){main{padding:20px 16px}header{align-items:flex-start;flex-direction:column}.teams,.plans,.content{grid-template-columns:1fr}.plans article+article{border:0;border-top:1px solid var(--line);padding:18px 0 0}.panel{padding:18px}.remember{flex-direction:column}.pick{font-size:11px}table{font-size:12px}th,td{padding:8px}.toolbar button{font-size:13px}}
</style>
<main><header><div><div class="logo">LoL Coach</div><div class="small">게임플랜 · 화면 시안 01</div></div><nav id="presets" aria-label="내 챔피언 선택"></nav></header><div id="app"></div><footer>경기 전 조합을 바탕으로 만든 조건부 계획입니다. 실제 적 위치·체력·기술 사용 여부를 관측한 결과가 아닙니다. 저장된 16.20 자료를 사용합니다.<br>LoL Coach는 Riot Games의 공식 서비스가 아닙니다.</footer></main>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
'use strict';const data=JSON.parse(document.getElementById('payload').textContent),app=document.getElementById('app');
const roles={TOP:'탑',JUNGLE:'정글',BOTTOM:'원거리 딜러'},areas=['lane','operations','fight'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected='Graves',area='operations';
function readHash(){const p=new URLSearchParams(location.hash.slice(1));selected=data.presets.some(x=>x.id===p.get('champion'))?p.get('champion'):'Graves';area=areas.includes(p.get('area'))?p.get('area'):'operations';}
function navigate(id,a){location.hash=new URLSearchParams({champion:id,area:a}).toString();readHash();render();}
function roster(team,self,enemy){return '<div class="roster '+(enemy?'enemy':'')+'"><div class="roster-title">'+(enemy?'상대 조합':'우리 조합')+'</div><div class="picks">'+team.map(x=>{const c=data.champions[x.champion],p=c.portrait;return '<div class="pick '+(x.champion===self?'self':'')+'"><span class="portrait" style="background-image:url('+c.sheet+');background-position:-'+p.x+'px -'+p.y+'px"></span>'+esc(c.name)+(x.champion===self?' · 나':'')+'</div>';}).join('')+'</div></div>';}
function render(){const preset=data.presets.find(x=>x.id===selected),v=preset.view,t=v.team_plan,card=v.cards.find(x=>x.id===area);
 document.getElementById('presets').innerHTML=data.presets.map(p=>'<button type="button" data-preset="'+p.id+'" aria-pressed="'+(p.id===selected)+'">'+p.name+' · '+roles[p.input.own_position]+'</button>').join('');
 app.innerHTML='<section class="intro"><div class="eyebrow">이번 판, 내가 만들 흐름</div><h1>'+esc(v.hero_title)+'</h1><p class="muted">'+esc(v.support)+'</p></section><div class="teams">'+roster(preset.input.allies,selected,false)+roster(preset.input.enemies,selected,true)+'</div><section class="panel"><h2>전체적인 조합 방향</h2><div class="plans"><article class="ours"><h3>우리는 이렇게 이겨요</h3><p>'+esc(t.ours.win)+'</p><p class="muted">'+esc(t.ours.macro)+'</p></article><article class="theirs"><h3>상대가 원하는 싸움</h3><p>'+esc(t.theirs.win)+'</p><p class="muted">'+esc(t.theirs.opening)+'</p></article></div><div class="role"><strong>내 역할</strong><br>'+esc(v.support)+'</div><details><summary>조합 비교 자세히 보기</summary><table><thead><tr><th>기준</th><th>우리</th><th>상대</th></tr></thead><tbody>'+t.rows.map(r=>'<tr><th>'+esc(r.label)+'</th><td>'+esc(r.ours)+'</td><td>'+esc(r.theirs)+'</td></tr>').join('')+'</tbody></table></details></section><nav class="tabnav" aria-label="게임플랜 영역">'+v.cards.map(c=>'<button type="button" data-area="'+c.id+'" aria-pressed="'+(c.id===area)+'">'+esc(c.label)+'</button>').join('')+'</nav><div class="content"><section class="panel"><div class="eyebrow">'+esc(card.label)+' · 핵심 행동 5개</div><h2>'+esc(card.concept||card.title)+'</h2><ol class="actions">'+card.actions.map(a=>'<li><div><strong>'+esc(a.label)+'</strong><p>'+esc(a.text)+'</p></div></li>').join('')+'</ol></section><aside><section class="panel reason"><h2>왜 이렇게 풀어가나요?</h2>'+card.explanation.map(p=>'<p>'+esc(p)+'</p>').join('')+'</section><section class="panel"><h2>상황이 달라지면</h2>'+card.condition_responses.slice(0,3).map(c=>'<article class="condition"><h3>'+esc(c.trigger)+'</h3><p>'+esc(c.action)+'</p><p class="stop">멈출 조건 · '+esc(c.stop)+'</p></article>').join('')+(card.condition_responses.length>3?'<details><summary>다른 조건 '+(card.condition_responses.length-3)+'개 더 보기</summary>'+card.condition_responses.slice(3).map(c=>'<article class="condition"><h3>'+esc(c.trigger)+'</h3><p>'+esc(c.action)+'</p><p class="stop">멈출 조건 · '+esc(c.stop)+'</p></article>').join('')+'</details>':'')+'</section></aside></div><section class="panel"><h3>게임에 들어가기 전 기억할 것</h3><div class="remember">'+v.remember.map(s=>'<p>'+esc(s)+'</p>').join('')+'</div></section><div class="toolbar"><button id="download" type="button">현재 선택 JSON 저장</button><button id="copy" type="button">현재 화면 링크 복사</button><span id="status" class="small" role="status"></span></div><details><summary>같은 화면 재현하기</summary><p class="small">이 HTML 파일은 인터넷 연결 없이 열 수 있습니다. 챔피언과 영역은 주소 끝에 보존됩니다. 파일을 전달할 때는 HTML 파일과 주소의 # 뒤 내용을 함께 전달하세요. 아래 입력과 포함된 소스 해시로 분석 조건을 확인할 수 있습니다.</p><pre>'+esc(JSON.stringify({input:preset.input,area,source_sha256:data.source_sha256},null,2))+'</pre></details>';
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>navigate(b.dataset.preset,area));document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>navigate(selected,b.dataset.area));
 document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,input:preset.input,area,source_sha256:data.source_sha256},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gameplan-'+selected+'-'+area+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='현재 입력과 선택한 영역을 저장했습니다.';};
 document.getElementById('copy').onclick=async()=>{const link=location.href.split('#')[0]+'#'+new URLSearchParams({champion:selected,area});try{await navigator.clipboard.writeText(link);document.getElementById('status').textContent='현재 화면 링크를 복사했습니다.';}catch{document.getElementById('status').textContent='주소창의 링크를 복사하세요. 현재 선택이 주소에 저장되어 있습니다.';}};
}
window.addEventListener('hashchange',()=>{readHash();render();});readHash();render();
</script></html>
